          TYp8iuxxJNDdaa+a0LzPZ/tcuow6+kT+VtDLlaOIwV6WsnKw7D0dFf4WSh/YOcRJrTWgor3Pmt2Jg51TJryOqcAEAl/yYCgRYDMj
          /vuSyCzVjsnqA1IjRI/qzK0vh0ozI27scAlpIDujgpOtfNctdG4rkvDyyRBXgbTkOkhjBYrY8wsk+IaAGzDT7qZHp05x/ob94U8O
          zJddaaXtGqcvOSSQW85Ese6m9RksV/rJaka3Sg2gMiNSbsSTbSMjAaTyUqjai159nNARE3w1SA9kM0CBDEjf7i9e7s8AmQOZQKp9
          yFWKugAAmFY4ztriO6IAAejGB4CQJpd8uYCxxGf7AgAAAAAEWVo=
          EOF_PAYLOAD
          tar -xJf /tmp/ios-payload.tar.xz
          test -f engine/Source/NSDLDrv/Src/NSDLViewport.cpp && test -f ios/host/UE1IOSHost.mm
      - name: Generate build files (edit THIS yml to change the build)
        run: |
          set -euo pipefail
          mkdir -p ios/cmake ios/scripts
          cat > ios/cmake/ios-armv7-toolchain.cmake <<'EOF_TC'
          # Toolchain: iOS armv7 (min iOS 7.0) cross-compiled from Linux.
          # Needs: L1ghtmann LLVM iOS toolchain (Theos) + iPhoneOS 9.3 SDK.
          #   IOS_TOOLCHAIN_BIN  = <theos>/toolchain/linux/iphone/bin   (or set THEOS)
          #   IOS_SDK            = <theos>/sdks/iPhoneOS9.3.sdk          (or set THEOS)
          # CMake's own iOS platform module needs an Apple SDK name (fails on Linux): use Darwin and flag IOS ourselves.
          set(CMAKE_SYSTEM_NAME Darwin)
          set(IOS TRUE)
          set(CMAKE_SYSTEM_PROCESSOR armv7)
          set(CMAKE_OSX_ARCHITECTURES armv7 CACHE STRING "" FORCE)

          if(NOT IOS_TOOLCHAIN_BIN)
            if(DEFINED ENV{IOS_TOOLCHAIN_BIN})
              set(IOS_TOOLCHAIN_BIN $ENV{IOS_TOOLCHAIN_BIN})
            elseif(DEFINED ENV{THEOS})
              set(IOS_TOOLCHAIN_BIN $ENV{THEOS}/toolchain/linux/iphone/bin)
            endif()
          endif()
          if(NOT IOS_SDK)
            if(DEFINED ENV{IOS_SDK})
              set(IOS_SDK $ENV{IOS_SDK})
            elseif(DEFINED ENV{THEOS})
              set(IOS_SDK $ENV{THEOS}/sdks/iPhoneOS9.3.sdk)
            endif()
          endif()
          if(NOT IOS_TOOLCHAIN_BIN OR NOT IOS_SDK)
            message(FATAL_ERROR "Set THEOS, or IOS_TOOLCHAIN_BIN and IOS_SDK")
          endif()

          set(CMAKE_SYSROOT ${IOS_SDK})
          set(CMAKE_OSX_SYSROOT ${IOS_SDK} CACHE PATH "" FORCE)
          set(CMAKE_C_COMPILER   ${IOS_TOOLCHAIN_BIN}/clang)
          set(CMAKE_CXX_COMPILER ${IOS_TOOLCHAIN_BIN}/clang++)
          set(CMAKE_OBJC_COMPILER   ${IOS_TOOLCHAIN_BIN}/clang)
          set(CMAKE_OBJCXX_COMPILER ${IOS_TOOLCHAIN_BIN}/clang++)
          foreach(L C CXX OBJC OBJCXX)
            set(CMAKE_${L}_COMPILER_WORKS TRUE)
            set(CMAKE_${L}_COMPILER_TARGET armv7-apple-ios7.0)
          endforeach()
          find_program(IOS_AR     NAMES llvm-ar ar         HINTS ${IOS_TOOLCHAIN_BIN} NO_DEFAULT_PATH)
          find_program(IOS_RANLIB NAMES llvm-ranlib ranlib HINTS ${IOS_TOOLCHAIN_BIN} NO_DEFAULT_PATH)
          find_program(IOS_AR     NAMES llvm-ar ar)
          find_program(IOS_RANLIB NAMES llvm-ranlib ranlib)
          set(CMAKE_AR ${IOS_AR} CACHE FILEPATH "" FORCE)
          set(CMAKE_RANLIB ${IOS_RANLIB} CACHE FILEPATH "" FORCE)

          # Optional: ld64 (cctools-port / ld64.lld) if clang can't find the linker itself.
          if(DEFINED ENV{IOS_LD})
            set(_ld "-fuse-ld=$ENV{IOS_LD}")
          endif()

          # 9.3 SDK module maps confuse modern clang.
          set(_common "-arch armv7 -miphoneos-version-min=7.0 -isysroot ${IOS_SDK} -fno-modules -fno-implicit-modules -fno-implicit-module-maps -Wno-deprecated-declarations -Wno-error")
          set(CMAKE_C_FLAGS_INIT   "${_common}")
          # Toolchain's libc++ 19 headers lack __config_site; use the SDK's own libc++ headers (match the SDK's libc++.dylib).
          set(_cxxinc "")
          if(EXISTS ${IOS_SDK}/usr/include/c++/v1)
            set(_cxxinc "-nostdinc++ -isystem ${IOS_SDK}/usr/include/c++/v1")
          endif()
          set(CMAKE_CXX_FLAGS_INIT "${_common} -stdlib=libc++ ${_cxxinc}")
          set(CMAKE_OBJC_FLAGS_INIT   "${_common}")
          set(CMAKE_OBJCXX_FLAGS_INIT "${_common} -stdlib=libc++ ${_cxxinc}")
          set(CMAKE_EXE_LINKER_FLAGS_INIT "-arch armv7 -miphoneos-version-min=7.0 -isysroot ${IOS_SDK} ${_ld}")
          # Platform/Darwin.cmake forces libtool for static libs (absent on Linux) and overwrites anything set here,
          # which made EVERY try_compile (check_function_exists, pthreads, ...) fail. A rules override is loaded after
          # the platform module and is propagated into try_compile projects, so use plain ar+ranlib there.
          set(CMAKE_USER_MAKE_RULES_OVERRIDE ${CMAKE_CURRENT_LIST_DIR}/ios-rules-override.cmake)
          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          set(CMAKE_FIND_ROOT_PATH ${IOS_SDK})
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          EOF_TC
          cat > ios/cmake/ios-rules-override.cmake <<'EOF_OV'
          foreach(L C CXX OBJC OBJCXX)
            set(CMAKE_${L}_CREATE_STATIC_LIBRARY "<CMAKE_AR> qc <TARGET> <LINK_FLAGS> <OBJECTS>" "<CMAKE_RANLIB> <TARGET>")
          endforeach()
          EOF_OV
          cat > CMakeLists.txt <<'EOF_CM'
          cmake_minimum_required(VERSION 3.20)
          project(UnrealiOS C CXX OBJC OBJCXX)

          # Static libs via plain ar+ranlib (no libtool/Apple tools on Linux)
          foreach(L C CXX OBJC OBJCXX)
            set(CMAKE_${L}_CREATE_STATIC_LIBRARY "<CMAKE_AR> qc <TARGET> <LINK_FLAGS> <OBJECTS>" "<CMAKE_RANLIB> <TARGET>")
          endforeach()

          set(CMAKE_POSITION_INDEPENDENT_CODE OFF)
          set(CMAKE_BUILD_TYPE RelWithDebInfo CACHE STRING "")

          # ---- SDL2 (UIKit, static, GLES only)
          set(SDL_SHARED OFF CACHE BOOL "" FORCE)
          set(SDL_STATIC ON  CACHE BOOL "" FORCE)
          set(SDL_TEST   OFF CACHE BOOL "" FORCE)
          set(SDL_TESTS  OFF CACHE BOOL "" FORCE)
          set(SDL_METAL  OFF CACHE BOOL "" FORCE)
          set(SDL_RENDER_METAL OFF CACHE BOOL "" FORCE)
          set(SDL_VULKAN OFF CACHE BOOL "" FORCE)
          set(SDL_AUDIO  OFF CACHE BOOL "" FORCE)
          set(SDL_HAPTIC OFF CACHE BOOL "" FORCE)
          set(SDL_HIDAPI OFF CACHE BOOL "" FORCE)
          # iPhoneOS 9.3 SDK has no GCMicroGamepad etc. -> MFi joystick can't build; SDL falls back to its dummy joystick driver
          set(SDL_JOYSTICK OFF CACHE BOOL "" FORCE)
          set(SDL_OPENGLES ON CACHE BOOL "" FORCE)
          add_subdirectory(third_party/SDL2 EXCLUDE_FROM_ALL)

          # Expose headers as <SDL2/SDL.h>
          file(MAKE_DIRECTORY ${CMAKE_BINARY_DIR}/sdlinc)
          file(CREATE_LINK ${CMAKE_SOURCE_DIR}/third_party/SDL2/include ${CMAKE_BINARY_DIR}/sdlinc/SDL2 SYMBOLIC)
          set(SDL2_INCLUDE_DIR "${CMAKE_BINARY_DIR}/sdlinc;${CMAKE_SOURCE_DIR}/third_party/SDL2/include" CACHE STRING "" FORCE)
          set(SDL2_LIBRARY SDL2-static CACHE STRING "" FORCE)

          # ---- libxmp
          set(BUILD_STATIC ON CACHE BOOL "" FORCE)
          set(BUILD_SHARED OFF CACHE BOOL "" FORCE)
          set(BUILD_LITE OFF CACHE BOOL "" FORCE)
          set(WITH_UNIT_TESTS OFF CACHE BOOL "" FORCE)
          add_subdirectory(third_party/libxmp EXCLUDE_FROM_ALL)
          set(LIBXMP_INCLUDE_DIR ${CMAKE_SOURCE_DIR}/third_party/libxmp/include CACHE STRING "" FORCE)
          set(LIBXMP_LIBRARY xmp_static CACHE STRING "" FORCE)

          # ---- OpenAL (Apple framework + shim headers for EFX/SOFT extensions)
          set(OPENAL_INCLUDE_DIR ${CMAKE_SOURCE_DIR}/ios/shim CACHE STRING "" FORCE)
          set(OPENAL_LIBRARY "-framework OpenAL" CACHE STRING "" FORCE)

          # ---- UE1
          set(USE_SDL ON CACHE BOOL "" FORCE)
          set(BUILD_EDITOR OFF CACHE BOOL "" FORCE)
          set(BUILD_SOFTDRV OFF CACHE BOOL "" FORCE)
          set(BUILD_NOPENGLDRV OFF CACHE BOOL "" FORCE)
          set(BUILD_WINDRV OFF CACHE BOOL "" FORCE)
          set(BUILD_NOPENGLESDRV ON CACHE BOOL "" FORCE)
          set(BUILD_NOPENALDRV ON CACHE BOOL "" FORCE)
          set(BUILD_NULLSOUNDDRV ON CACHE BOOL "" FORCE)
          add_subdirectory(engine/Source ue1)

          # ---- Host app
          add_executable(UnrealiOS
            ios/host/UE1IOSHost.mm
            ios/host/ios_availability_stub.m)
          set_source_files_properties(ios/host/UE1IOSHost.mm PROPERTIES COMPILE_OPTIONS "-fobjc-arc")
          target_include_directories(UnrealiOS PRIVATE ${SDL2_INCLUDE_DIR})

          # UE1 packages register themselves via static initializers -> force_load each.
          set(UE1_LIBS Core Engine Render IpDrv Fire NSDLDrv NOpenGLESDrv NOpenALDrv SoundDrv Unreal)
          set(_fl "")
          foreach(t ${UE1_LIBS})
            if(TARGET ${t})
              add_dependencies(UnrealiOS ${t})
              list(APPEND _fl "-Wl,-force_load,$<TARGET_FILE:${t}>")
            endif()
          endforeach()
          target_link_libraries(UnrealiOS PRIVATE ${_fl} SDL2main SDL2-static xmp_static
            "-framework UIKit" "-framework Foundation" "-framework OpenGLES" "-framework OpenAL"
            "-framework QuartzCore" "-framework CoreGraphics" "-framework AudioToolbox"
            "-framework CoreAudio" "-framework CoreMotion" "-framework CoreFoundation"
            "-framework AVFoundation" "-framework CoreVideo" "-weak_framework GameController"
            "-Wl,-dead_strip" c++)
          set_target_properties(UnrealiOS PROPERTIES OUTPUT_NAME UnrealiOS)
          EOF_CM
          cat > ios/scripts/package_ios.sh <<'EOF_PK'
          #!/usr/bin/env bash
          # Usage: package_ios.sh <build-dir> [out-dir]  -> UnrealiOS.ipa (unsigned/ldid fake-signed)
          set -euo pipefail
          B="${1:?build dir}"; OUT="${2:-$B/out}"
          R="$(cd "$(dirname "$0")/.." && pwd)"
          BIN="$B/UnrealiOS"; [ -f "$BIN" ] || { echo "no $BIN"; exit 1; }
          rm -rf "$OUT/Payload"; APP="$OUT/Payload/UnrealiOS.app"; mkdir -p "$APP"
          cp "$BIN" "$APP/UnrealiOS"
          cp "$R/resources/Info.plist" "$APP/"
          find "$R/resources" -maxdepth 1 -name '*.png' -exec cp {} "$APP/" \;
          LDID="${LDID:-$(command -v ldid || ls ${THEOS:-/nonexistent}/toolchain/linux/iphone/bin/ldid 2>/dev/null || true)}"
          if [ -n "$LDID" ]; then "$LDID" -S"$R/resources/entitlements.plist" "$APP/UnrealiOS"; else echo "warning: ldid not found, binary unsigned"; fi
          (cd "$OUT" && rm -f UnrealiOS.ipa && zip -qr UnrealiOS.ipa Payload)
          echo "built $OUT/UnrealiOS.ipa"
          EOF_PK
          chmod +x ios/scripts/package_ios.sh
          # ---- put extra source fixes (sed/patch) below ----
          # iOS 9.3 SDK lacks openURL:options:completionHandler: (iOS 10+); use the old API
          sed -i 's|openURL:nsurl options:@{} completionHandler:^(BOOL success) {}|openURL:nsurl|' third_party/SDL2/src/misc/ios/SDL_sysurl.m
          ! grep -q completionHandler third_party/SDL2/src/misc/ios/SDL_sysurl.m
          # AvailabilityVersions.h is not in the 9.3 SDK (the file already #defines __IPHONE_13_0 as fallback)
          sed -i '/#include <AvailabilityVersions.h>/d' third_party/SDL2/src/video/uikit/SDL_uikitappdelegate.m
          # iOS 15 high-refresh-rate API (CAFrameRateRange) doesn't exist in 9.3 SDK
          perl -0pi -e 's/(        if \(\@available\(iOS 15\.0, tvOS 15\.0, \*\)\) \{.*?\n        \}\n)/#if __IPHONE_OS_VERSION_MAX_ALLOWED >= 150000\n$1#endif\n/s' third_party/SDL2/src/video/uikit/SDL_uikitviewcontroller.m
          grep -q 'MAX_ALLOWED >= 150000' third_party/SDL2/src/video/uikit/SDL_uikitviewcontroller.m
          # Apple's <unistd.h> already typedefs uuid_t (unsigned char[16]) -> rename UnGUID.cpp's private copy
          sed -i -E 's/\buuid_t\b/ue_uuid_t/g; s/\buuid_create\b/ue_uuid_create/g; s/\buuid_init\b/ue_uuid_init/g' engine/Source/Core/Src/UnGUID.cpp
          # SDL treats CMAKE_SYSTEM_NAME=Darwin as macOS and links Cocoa/Carbon; we are iOS
          sed -i 's/^  if(MACOS)$/  if(MACOS AND NOT IOS)/' third_party/SDL2/CMakeLists.txt
          grep -q 'if(MACOS AND NOT IOS)' third_party/SDL2/CMakeLists.txt
          # iOS patch payload skips linking Engine/Core into the Unreal launcher lib -> Engine.h include dir is missing. Add it.
          cat >> engine/Source/Unreal/CMakeLists.txt <<'EOF_UN'

          if(IOS)
            target_link_libraries(${PROJECT_NAME} PUBLIC Engine Core)
          endif()
          EOF_UN
          # iOS 11 view-controller selectors aren't declared in the 9.3 SDK: call them dynamically (already guarded by respondsToSelector)
          sed -i 's|\[viewcontroller setNeedsUpdateOfHomeIndicatorAutoHidden\];|[viewcontroller performSelector:@selector(setNeedsUpdateOfHomeIndicatorAutoHidden)];|; s|\[viewcontroller setNeedsUpdateOfScreenEdgesDeferringSystemGestures\];|[viewcontroller performSelector:@selector(setNeedsUpdateOfScreenEdgesDeferringSystemGestures)];|' third_party/SDL2/src/video/uikit/SDL_uikitviewcontroller.m
          ! grep -q '\[viewcontroller setNeedsUpdateOf' third_party/SDL2/src/video/uikit/SDL_uikitviewcontroller.m
      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build curl zip unzip xz-utils bzip2 git
      - name: Theos + toolchain + SDK
        run: |
          set -euo pipefail
          export THEOS="$GITHUB_WORKSPACE/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain/linux/iphone" "$THEOS/sdks"
          curl -fsSL "https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz" -o /tmp/tc.tar.xz
          tar -xf /tmp/tc.tar.xz -C "$THEOS/toolchain"
          curl -fsSL -o /tmp/sdk.tbz2 "https://raw.githubusercontent.com/Sn0wCooder/theos-sdks/master/iPhoneOS9.3.sdk.tbz2"
          tar -xjf /tmp/sdk.tbz2 -C "$THEOS/sdks"
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          for fw in "$SDK"/System/Library/Frameworks/*.framework; do
            [ -f "$fw/module.map" ] && { mkdir -p "$fw/Modules"; mv "$fw/module.map" "$fw/Modules/module.modulemap"; }
          done
          find "$SDK/usr/include" -name module.map | while read -r m; do mv "$m" "$(dirname "$m")/module.modulemap"; done
          # toolchain's ar/ranlib wrappers call a missing aarch64-apple-darwin14-ranlib -> make it exist
          TB="$THEOS/toolchain/linux/iphone/bin"
          for t in ranlib; do
            [ -e "$TB/aarch64-apple-darwin14-$t" ] || ln -sf "$TB/llvm-$t" "$TB/aarch64-apple-darwin14-$t" 2>/dev/null || true
          done
          ls "$TB" | grep -E 'llvm-(ar|ranlib)$|ranlib' || true
          echo "== libc++ discovery"
          find "$SDK/usr/include" -maxdepth 2 -iname '*c++*' 2>/dev/null | head
          find "$THEOS/toolchain" -name '__config_site' 2>/dev/null | head
          CS="$TB/../include/c++/v1/__config_site"
          if [ -d "$SDK/usr/include/c++/v1" ]; then echo "SDK libc++ headers: ok"
          elif [ ! -f "$CS" ]; then
            FOUND="$(find "$THEOS/toolchain" -name '__config_site' 2>/dev/null | head -n1)"
            if [ -n "$FOUND" ]; then cp "$FOUND" "$CS"; else
              echo "no __config_site anywhere; writing one (libc++ 19, Apple, pthread)"
              cat > "$CS" <<'EOF_CS'
          #ifndef _LIBCPP_CONFIG_SITE
          #define _LIBCPP_CONFIG_SITE
          #define _LIBCPP_ABI_VERSION 1
          #define _LIBCPP_ABI_NAMESPACE __1
          #define _LIBCPP_HAS_THREAD_API_PTHREAD 1
          #define _LIBCPP_HARDENING_MODE_DEFAULT _LIBCPP_HARDENING_MODE_NONE
          #define _LIBCPP_PSTL_BACKEND_SERIAL 1
          #endif
          EOF_CS
            fi
          fi
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
      - name: Toolchain sanity (shows the real compiler error)
        run: |
          B="$THEOS/toolchain/linux/iphone/bin"; SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          ls "$B" | head -50; ls "$SDK" | head
          printf '#include <fcntl.h>\n#include <pthread.h>\n#include <math.h>\nint main(void){pthread_attr_t t;pthread_attr_init(&t);return (int)tan(1.0)+O_CLOEXEC;}\n' > /tmp/t.c
          echo "== compile (cmake-style flags)"; "$B/clang" --target=armv7-apple-ios7.0 -arch armv7 -miphoneos-version-min=7.0 -isysroot "$SDK" -fno-modules -c /tmp/t.c -o /tmp/t.o -v || true
          echo "== archive"; "$B/llvm-ar" qc /tmp/t.a /tmp/t.o && echo archive-ok || true
          ls -la /tmp/t.o /tmp/t.a || true
      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=ios/cmake/ios-armv7-toolchain.cmake 2>&1 | tee build-configure.log || {
            echo "::group::CMakeError.log"; tail -n 120 build/CMakeFiles/CMakeError.log || true; echo "::endgroup::"
            cp build/CMakeFiles/CMakeError.log build-cmakeerror.log 2>/dev/null || true
            exit 1; }
      - name: Build
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" 2>&1 | tee build-make.log
      - name: Verify Mach-O
        run: |
          file build/UnrealiOS || true
          "$THEOS"/toolchain/linux/iphone/bin/*otool* -hv build/UnrealiOS | head || true
      - name: Package
        run: ios/scripts/package_ios.sh build build/out
      - uses: actions/upload-artifact@v4
        with: { name: Unreal98-armv7-iOS, path: build/out/UnrealiOS.ipa, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-logs, path: "build-*.log", if-no-files-found: ignore }
