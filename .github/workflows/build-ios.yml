name: Build Unreal 98 (iOS armv7)
on: workflow_dispatch
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Stage sources from repo + apply iOS patch payload
        run: |
          set -euo pipefail
          CPP="$(find . -type d -path '*/source/app/src/main/cpp' -not -path './theos/*' | head -n1)"
          [ -n "$CPP" ] || CPP="$(find . -type d -path '*/main/cpp' -not -path './theos/*' -not -path '*ouya*' | head -n1)"
          echo "cpp dir: $CPP"
          test -d "$CPP/UE1/Source" && test -d "$CPP/thirdparty/SDL2" && test -d "$CPP/thirdparty/libxmp"
          mkdir -p engine third_party
          cp -r "$CPP/UE1/Source" engine/Source
          cp -r "$CPP/UE1/Thirdparty" engine/Thirdparty
          cp -r "$CPP/thirdparty/SDL2" third_party/SDL2
