      - name: Generate build files (edit THIS yml to change the build)
        run: |
          set -euo pipefail
          mkdir -p ios/cmake ios/scripts
          cat > ios/cmake/ios-armv7-toolchain.cmake <<'EOF_TC'
          # Toolchain: iOS armv7 (min iOS 7.0) cross-compiled from Linux.
          # Needs: L1ghtmann LLVM iOS toolchain (Theos) + iPhoneOS 9.3 SDK.
          #   IOS_TOOLCHAIN_BIN  = <theos>/toolchain/linux/iphone/bin   (or set THEOS)
          #   IOS_SDK            = <theos>/sdks/iPhoneOS9.3.sdk          (or set THEOS)
          # CMake's own iOS platform module needs an Apple SDK name (fails on Linux): use Darwin and flag IOS ourselves.
          set(CMAKE_SYSTEM_NAME Darwin)
          set(IOS TRUE)
          set(CMAKE_SYSTEM_PROCESSOR armv7)
          set(CMAKE_OSX_ARCHITECTURES armv7 CACHE STRING "" FORCE)

          if(NOT IOS_TOOLCHAIN_BIN)
            if(DEFINED ENV{IOS_TOOLCHAIN_BIN})
              set(IOS_TOOLCHAIN_BIN $ENV{IOS_TOOLCHAIN_BIN})
            elseif(DEFINED ENV{THEOS})
              set(IOS_TOOLCHAIN_BIN $ENV{THEOS}/toolchain/linux/iphone/bin)
            endif()
          endif()
          if(NOT IOS_SDK)
            if(DEFINED ENV{IOS_SDK})
              set(IOS_SDK $ENV{IOS_SDK})
            elseif(DEFINED ENV{THEOS})
              set(IOS_SDK $ENV{THEOS}/sdks/iPhoneOS9.3.sdk)
            endif()
          endif()
          if(NOT IOS_TOOLCHAIN_BIN OR NOT IOS_SDK)
            message(FATAL_ERROR "Set THEOS, or IOS_TOOLCHAIN_BIN and IOS_SDK")
          endif()

          set(CMAKE_SYSROOT ${IOS_SDK})
          set(CMAKE_OSX_SYSROOT ${IOS_SDK} CACHE PATH "" FORCE)
          set(CMAKE_C_COMPILER   ${IOS_TOOLCHAIN_BIN}/clang)
          set(CMAKE_CXX_COMPILER ${IOS_TOOLCHAIN_BIN}/clang++)
          set(CMAKE_OBJC_COMPILER   ${IOS_TOOLCHAIN_BIN}/clang)
          set(CMAKE_OBJCXX_COMPILER ${IOS_TOOLCHAIN_BIN}/clang++)
          foreach(L C CXX OBJC OBJCXX)
            set(CMAKE_${L}_COMPILER_WORKS TRUE)
            set(CMAKE_${L}_COMPILER_TARGET armv7-apple-ios7.0)
          endforeach()
          find_program(IOS_AR     NAMES llvm-ar ar         HINTS ${IOS_TOOLCHAIN_BIN} NO_DEFAULT_PATH)
          find_program(IOS_RANLIB NAMES llvm-ranlib ranlib HINTS ${IOS_TOOLCHAIN_BIN} NO_DEFAULT_PATH)
          find_program(IOS_AR     NAMES llvm-ar ar)
          find_program(IOS_RANLIB NAMES llvm-ranlib ranlib)
          set(CMAKE_AR ${IOS_AR} CACHE FILEPATH "" FORCE)
          set(CMAKE_RANLIB ${IOS_RANLIB} CACHE FILEPATH "" FORCE)

          # Optional: ld64 (cctools-port / ld64.lld) if clang can't find the linker itself.
          if(DEFINED ENV{IOS_LD})
            set(_ld "-fuse-ld=$ENV{IOS_LD}")
          endif()

          # 9.3 SDK module maps confuse modern clang.
          set(_common "-arch armv7 -miphoneos-version-min=7.0 -isysroot ${IOS_SDK} -fno-modules -fno-implicit-modules -fno-implicit-module-maps -Wno-deprecated-declarations -Wno-error")
          set(CMAKE_C_FLAGS_INIT   "${_common}")
          # Toolchain's libc++ 19 headers lack __config_site; use the SDK's own libc++ headers (match the SDK's libc++.dylib).
          set(_cxxinc "")
          if(EXISTS ${IOS_SDK}/usr/include/c++/v1)
            set(_cxxinc "-nostdinc++ -isystem ${IOS_SDK}/usr/include/c++/v1")
          endif()
          set(CMAKE_CXX_FLAGS_INIT "${_common} -stdlib=libc++ ${_cxxinc}")
          set(CMAKE_OBJC_FLAGS_INIT   "${_common}")
          set(CMAKE_OBJCXX_FLAGS_INIT "${_common} -stdlib=libc++ ${_cxxinc}")
          set(CMAKE_EXE_LINKER_FLAGS_INIT "-arch armv7 -miphoneos-version-min=7.0 -isysroot ${IOS_SDK} ${_ld}")
          # Platform/Darwin.cmake forces libtool for static libs (absent on Linux) and overwrites anything set here,
          # which made EVERY try_compile (check_function_exists, pthreads, ...) fail. A rules override is loaded after
          # the platform module and is propagated into try_compile projects, so use plain ar+ranlib there.
          set(CMAKE_USER_MAKE_RULES_OVERRIDE ${CMAKE_CURRENT_LIST_DIR}/ios-rules-override.cmake)
          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          set(CMAKE_FIND_ROOT_PATH ${IOS_SDK})
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          EOF_TC
          cat > ios/cmake/ios-rules-override.cmake <<'EOF_OV'
          foreach(L C CXX OBJC OBJCXX)
            set(CMAKE_${L}_CREATE_STATIC_LIBRARY "<CMAKE_AR> qc <TARGET> <LINK_FLAGS> <OBJECTS>" "<CMAKE_RANLIB> <TARGET>")
          endforeach()
          EOF_OV
          cat > CMakeLists.txt <<'EOF_CM'
          cmake_minimum_required(VERSION 3.20)
          project(UnrealiOS C CXX OBJC OBJCXX)

          # Static libs via plain ar+ranlib (no libtool/Apple tools on Linux)
          foreach(L C CXX OBJC OBJCXX)
            set(CMAKE_${L}_CREATE_STATIC_LIBRARY "<CMAKE_AR> qc <TARGET> <LINK_FLAGS> <OBJECTS>" "<CMAKE_RANLIB> <TARGET>")
          endforeach()

          set(CMAKE_POSITION_INDEPENDENT_CODE OFF)
          set(CMAKE_BUILD_TYPE RelWithDebInfo CACHE STRING "")

          # ---- SDL2 (UIKit, static, GLES only)
          set(SDL_SHARED OFF CACHE BOOL "" FORCE)
          set(SDL_STATIC ON  CACHE BOOL "" FORCE)
          set(SDL_TEST   OFF CACHE BOOL "" FORCE)
          set(SDL_TESTS  OFF CACHE BOOL "" FORCE)
          set(SDL_METAL  OFF CACHE BOOL "" FORCE)
          set(SDL_RENDER_METAL OFF CACHE BOOL "" FORCE)
          set(SDL_VULKAN OFF CACHE BOOL "" FORCE)
          set(SDL_AUDIO  OFF CACHE BOOL "" FORCE)
          set(SDL_HAPTIC OFF CACHE BOOL "" FORCE)
          set(SDL_HIDAPI OFF CACHE BOOL "" FORCE)
          set(SDL_OPENGLES ON CACHE BOOL "" FORCE)
          add_subdirectory(third_party/SDL2 EXCLUDE_FROM_ALL)

          # Expose headers as <SDL2/SDL.h>
          file(MAKE_DIRECTORY ${CMAKE_BINARY_DIR}/sdlinc)
          file(CREATE_LINK ${CMAKE_SOURCE_DIR}/third_party/SDL2/include ${CMAKE_BINARY_DIR}/sdlinc/SDL2 SYMBOLIC)
          set(SDL2_INCLUDE_DIR "${CMAKE_BINARY_DIR}/sdlinc;${CMAKE_SOURCE_DIR}/third_party/SDL2/include" CACHE STRING "" FORCE)
          set(SDL2_LIBRARY SDL2-static CACHE STRING "" FORCE)

          # ---- libxmp
          set(BUILD_STATIC ON CACHE BOOL "" FORCE)
          set(BUILD_SHARED OFF CACHE BOOL "" FORCE)
          set(BUILD_LITE OFF CACHE BOOL "" FORCE)
          set(WITH_UNIT_TESTS OFF CACHE BOOL "" FORCE)
          add_subdirectory(third_party/libxmp EXCLUDE_FROM_ALL)
          set(LIBXMP_INCLUDE_DIR ${CMAKE_SOURCE_DIR}/third_party/libxmp/include CACHE STRING "" FORCE)
          set(LIBXMP_LIBRARY xmp_static CACHE STRING "" FORCE)

          # ---- OpenAL (Apple framework + shim headers for EFX/SOFT extensions)
          set(OPENAL_INCLUDE_DIR ${CMAKE_SOURCE_DIR}/ios/shim CACHE STRING "" FORCE)
          set(OPENAL_LIBRARY "-framework OpenAL" CACHE STRING "" FORCE)

          # ---- UE1
          set(USE_SDL ON CACHE BOOL "" FORCE)
          set(BUILD_EDITOR OFF CACHE BOOL "" FORCE)
          set(BUILD_SOFTDRV OFF CACHE BOOL "" FORCE)
          set(BUILD_NOPENGLDRV OFF CACHE BOOL "" FORCE)
          set(BUILD_WINDRV OFF CACHE BOOL "" FORCE)
          set(BUILD_NOPENGLESDRV ON CACHE BOOL "" FORCE)
          set(BUILD_NOPENALDRV ON CACHE BOOL "" FORCE)
          set(BUILD_NULLSOUNDDRV ON CACHE BOOL "" FORCE)
          add_subdirectory(engine/Source ue1)

          # ---- Host app
          add_executable(UnrealiOS
            ios/host/UE1IOSHost.mm
            ios/host/ios_availability_stub.m)
          set_source_files_properties(ios/host/UE1IOSHost.mm PROPERTIES COMPILE_OPTIONS "-fobjc-arc")
          target_include_directories(UnrealiOS PRIVATE ${SDL2_INCLUDE_DIR})

          # UE1 packages register themselves via static initializers -> force_load each.
          set(UE1_LIBS Core Engine Render IpDrv Fire NSDLDrv NOpenGLESDrv NOpenALDrv SoundDrv Unreal)
          set(_fl "")
          foreach(t ${UE1_LIBS})
            if(TARGET ${t})
              add_dependencies(UnrealiOS ${t})
              list(APPEND _fl "-Wl,-force_load,$<TARGET_FILE:${t}>")
            endif()
          endforeach()
          target_link_libraries(UnrealiOS PRIVATE ${_fl} SDL2main SDL2-static xmp_static
            "-framework UIKit" "-framework Foundation" "-framework OpenGLES" "-framework OpenAL"
            "-framework QuartzCore" "-framework CoreGraphics" "-framework AudioToolbox"
            "-framework CoreAudio" "-framework CoreMotion" "-framework CoreFoundation"
            "-framework AVFoundation" "-framework CoreVideo" "-weak_framework GameController"
            "-Wl,-dead_strip" c++)
          set_target_properties(UnrealiOS PROPERTIES OUTPUT_NAME UnrealiOS)
          EOF_CM
          cat > ios/scripts/package_ios.sh <<'EOF_PK'
          #!/usr/bin/env bash
          # Usage: package_ios.sh <build-dir> [out-dir]  -> UnrealiOS.ipa (unsigned/ldid fake-signed)
          set -euo pipefail
          B="${1:?build dir}"; OUT="${2:-$B/out}"
          R="$(cd "$(dirname "$0")/.." && pwd)"
          BIN="$B/UnrealiOS"; [ -f "$BIN" ] || { echo "no $BIN"; exit 1; }
          rm -rf "$OUT/Payload"; APP="$OUT/Payload/UnrealiOS.app"; mkdir -p "$APP"
          cp "$BIN" "$APP/UnrealiOS"
          cp "$R/resources/Info.plist" "$APP/"
          find "$R/resources" -maxdepth 1 -name '*.png' -exec cp {} "$APP/" \;
          LDID="${LDID:-$(command -v ldid || ls ${THEOS:-/nonexistent}/toolchain/linux/iphone/bin/ldid 2>/dev/null || true)}"
          if [ -n "$LDID" ]; then "$LDID" -S"$R/resources/entitlements.plist" "$APP/UnrealiOS"; else echo "warning: ldid not found, binary unsigned"; fi
          (cd "$OUT" && rm -f UnrealiOS.ipa && zip -qr UnrealiOS.ipa Payload)
          echo "built $OUT/UnrealiOS.ipa"
          EOF_PK
          chmod +x ios/scripts/package_ios.sh
          # ---- put extra source fixes (sed/patch) below ----
          # iOS 9.3 SDK lacks openURL:options:completionHandler: (iOS 10+); use the old API
          sed -i 's|openURL:nsurl options:@{} completionHandler:^(BOOL success) {}|openURL:nsurl|' third_party/SDL2/src/misc/ios/SDL_sysurl.m
          ! grep -q completionHandler third_party/SDL2/src/misc/ios/SDL_sysurl.m
          # AvailabilityVersions.h is not in the 9.3 SDK (the file already #defines __IPHONE_13_0 as fallback)
          sed -i '/#include <AvailabilityVersions.h>/d' third_party/SDL2/src/video/uikit/SDL_uikitappdelegate.m
          # iOS 15 high-refresh-rate API (CAFrameRateRange) doesn't exist in 9.3 SDK
          perl -0pi -e 's/(        if \(\@available\(iOS 15\.0, tvOS 15\.0, \*\)\) \{.*?\n        \}\n)/#if __IPHONE_OS_VERSION_MAX_ALLOWED >= 150000\n$1#endif\n/s' third_party/SDL2/src/video/uikit/SDL_uikitviewcontroller.m
          grep -q 'MAX_ALLOWED >= 150000' third_party/SDL2/src/video/uikit/SDL_uikitviewcontroller.m
          # Apple's <unistd.h> already typedefs uuid_t (unsigned char[16]) -> rename UnGUID.cpp's private copy
          sed -i -E 's/\buuid_t\b/ue_uuid_t/g; s/\buuid_create\b/ue_uuid_create/g; s/\buuid_init\b/ue_uuid_init/g' engine/Source/Core/Src/UnGUID.cpp
          # SDL treats CMAKE_SYSTEM_NAME=Darwin as macOS and links Cocoa/Carbon; we are iOS
          sed -i 's/^  if(MACOS)$/  if(MACOS AND NOT IOS)/' third_party/SDL2/CMakeLists.txt
          grep -q 'if(MACOS AND NOT IOS)' third_party/SDL2/CMakeLists.txt
          # iOS patch payload skips linking Engine/Core into the Unreal launcher lib -> Engine.h include dir is missing. Add it.
          cat >> engine/Source/Unreal/CMakeLists.txt <<'EOF_UN'

          if(IOS)
            target_link_libraries(${PROJECT_NAME} PUBLIC Engine Core)
          endif()
          EOF_UN
          # iOS 11 view-controller selectors aren't declared in the 9.3 SDK: call them dynamically (already guarded by respondsToSelector)
          sed -i 's|\[viewcontroller setNeedsUpdateOfHomeIndicatorAutoHidden\];|[viewcontroller performSelector:@selector(setNeedsUpdateOfHomeIndicatorAutoHidden)];|; s|\[viewcontroller setNeedsUpdateOfScreenEdgesDeferringSystemGestures\];|[viewcontroller performSelector:@selector(setNeedsUpdateOfScreenEdgesDeferringSystemGestures)];|' third_party/SDL2/src/video/uikit/SDL_uikitviewcontroller.m
          ! grep -q '\[viewcontroller setNeedsUpdateOf' third_party/SDL2/src/video/uikit/SDL_uikitviewcontroller.m
          # ---- diagnostics: mirror engine log to Documents/unreal_ios.log, crash/exception handlers, heartbeat ----
          cat > ios/host/ios_diag.mm <<'EOF_SRC'
          // ios_diag.mm - persistent log + crash/exception/hang diagnostics for the iOS host.
          //
          // Everything goes to <App>/Documents/unreal_ios.log (and NSLog):
          //   * engine debugf()/appError() lines (mirrored from UnPlat.cpp)
          //   * SDL_Log / SDL_SetError-style messages
          //   * fatal signals (SEGV/BUS/ILL/ABRT/FPE/TRAP) with a backtrace
          //   * uncaught NSException and std::terminate with the exception text
          //   * a heartbeat with the last log line, so a hang/black screen shows WHERE it stopped
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #include <SDL2/SDL.h>
          #include <execinfo.h>
          #include <fcntl.h>
          #include <pthread.h>
          #include <signal.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <time.h>
          #include <unistd.h>
          #include <exception>

          extern "C" const char* UE1IOSDocumentsDir( void );

          static int GFd = -1;
          static pthread_mutex_t GLock = PTHREAD_MUTEX_INITIALIZER;
          static char GLast[256] = "(nothing logged yet)";

          static void RawWrite( const char* S )
          {
          	if( GFd < 0 || !S ) return;
          	size_t N = strlen( S );
          	while( N )
          	{
          		ssize_t W = write( GFd, S, N );
          		if( W <= 0 ) break;
          		S += W; N -= (size_t)W;
          	}
          }

          static void EnsureOpen( void )
          {
          	if( GFd >= 0 ) return;
          	char Path[1100];
          	snprintf( Path, sizeof(Path), "%s/unreal_ios.log", UE1IOSDocumentsDir() );
          	GFd = open( Path, O_WRONLY | O_CREAT | O_APPEND, 0644 );
          }

          static void LogLine( const char* Msg, bool UpdateLast )
          {
          	if( !Msg ) return;
          	pthread_mutex_lock( &GLock );
          	EnsureOpen();
          	char Line[1400], Ts[16];
          	time_t Now = time( NULL ); struct tm Tm; localtime_r( &Now, &Tm );
          	strftime( Ts, sizeof(Ts), "%H:%M:%S", &Tm );
          	snprintf( Line, sizeof(Line), "[%s] %.1300s\n", Ts, Msg );
          	RawWrite( Line );
          	if( UpdateLast ) strlcpy( GLast, Msg, sizeof(GLast) );
          	pthread_mutex_unlock( &GLock );
          }

          extern "C" void UE1IOSLog( const char* Msg )
          {
          	LogLine( Msg, true );
          	if( Msg ) NSLog( @"[Unreal] %s", Msg );
          }

          static void CrashHandler( int Sig, siginfo_t* Si, void* )
          {
          	char B[400];
          	snprintf( B, sizeof(B), "\n*** CRASH: signal %d (%s) fault addr=%p\n*** last log line: %s\n",
          		Sig, strsignal( Sig ), Si ? Si->si_addr : NULL, GLast );
          	RawWrite( B );
          	void* Bt[64]; int N = backtrace( Bt, 64 );
          	if( GFd >= 0 ) backtrace_symbols_fd( Bt, N, GFd );
          	RawWrite( "*** end of crash report\n" );
          	signal( Sig, SIG_DFL );
          	raise( Sig );
          }

          static void TerminateHandler( void )
          {
          	static int Busy = 0;
          	if( !Busy )
          	{
          		Busy = 1;
          		char B[600];
          		try { throw; }
          		catch( const std::exception& E ) { snprintf( B, sizeof(B), "std::exception: %s", E.what() ); }
          		catch( const char* S )           { snprintf( B, sizeof(B), "thrown const char*: %s", S ? S : "(null)" ); }
          		catch( int I )                   { snprintf( B, sizeof(B), "thrown int: %d (Unreal appError?)", I ); }
          		catch( ... )                     { snprintf( B, sizeof(B), "unknown exception" ); }
          		char M[800];
          		snprintf( M, sizeof(M), "*** std::terminate: %s | last log line: %s", B, GLast );
          		LogLine( M, false );
          		void* Bt[64]; int N = backtrace( Bt, 64 );
          		if( GFd >= 0 ) backtrace_symbols_fd( Bt, N, GFd );
          	}
          	abort();
          }

          static void ObjCExceptionHandler( NSException* E )
          {
          	NSString* S = [NSString stringWithFormat:@"*** Uncaught NSException %@: %@\n%@", E.name, E.reason, [E callStackSymbols]];
          	LogLine( [S UTF8String], false );
          }

          static void SDLCALL SDLLogCB( void*, int Cat, SDL_LogPriority Pri, const char* Msg )
          {
          	char B[1100];
          	snprintf( B, sizeof(B), "SDL[cat=%d pri=%d]: %s", Cat, (int)Pri, Msg ? Msg : "" );
          	LogLine( B, true );
          }

          static void* HeartbeatThread( void* )
          {
          	int T = 0;
          	for( ;; )
          	{
          		sleep( T < 60 ? 5 : 30 );
          		T += ( T < 60 ? 5 : 30 );
          		char B[400];
          		snprintf( B, sizeof(B), "heartbeat +%ds | last log line: %s", T, GLast );
          		LogLine( B, false );
          	}
          	return NULL;
          }

          __attribute__((constructor)) static void UE1IOSDiagInit( void )
          {
          	@autoreleasepool
          	{
          		pthread_mutex_lock( &GLock ); EnsureOpen(); pthread_mutex_unlock( &GLock );
          		char H[300];
          		snprintf( H, sizeof(H), "\n==== Unreal iOS launch | build %s %s | iOS %s | %s ====",
          			__DATE__, __TIME__, [[[UIDevice currentDevice] systemVersion] UTF8String], [[[UIDevice currentDevice] model] UTF8String] );
          		LogLine( H, true );
          	}
          	static char AltStack[64 * 1024];
          	stack_t Ss; Ss.ss_sp = AltStack; Ss.ss_size = sizeof(AltStack); Ss.ss_flags = 0;
          	sigaltstack( &Ss, NULL );
          	struct sigaction Sa; memset( &Sa, 0, sizeof(Sa) );
          	Sa.sa_sigaction = CrashHandler;
          	Sa.sa_flags = SA_SIGINFO | SA_ONSTACK | SA_RESETHAND;
          	sigemptyset( &Sa.sa_mask );
          	const int Sigs[] = { SIGSEGV, SIGBUS, SIGILL, SIGABRT, SIGFPE, SIGTRAP };
          	for( size_t i = 0; i < sizeof(Sigs)/sizeof(Sigs[0]); i++ ) sigaction( Sigs[i], &Sa, NULL );
          	std::set_terminate( TerminateHandler );
          	NSSetUncaughtExceptionHandler( &ObjCExceptionHandler );
          	SDL_LogSetAllPriority( SDL_LOG_PRIORITY_INFO );
          	SDL_LogSetOutputFunction( SDLLogCB, NULL );
          	pthread_t Th;
          	if( pthread_create( &Th, NULL, HeartbeatThread, NULL ) == 0 ) pthread_detach( Th );
          	LogLine( "diag: crash/exception/SDL handlers + heartbeat installed", true );
          }
          EOF_SRC
          cat > ios/scripts/apply_diag.py <<'EOF_PY'
          #!/usr/bin/env python3
          """Wire engine logging into the iOS host log (unreal_ios.log) + add breadcrumbs.
          Run from the repo root. Every edit asserts that its anchor exists exactly once."""
          import re, sys

          def edit(path, pairs):
              s = open(path, encoding='utf-8', newline='').read()
              for old, new in pairs:
                  if s.count(old) != 1:
                      sys.exit("anchor not found exactly once in %s:\n%s" % (path, old))
                  s = s.replace(old, new)
              open(path, 'w', encoding='utf-8', newline='').write(s)

          # ---------------------------------------------------------------- UnPlat.cpp
          edit('engine/Source/Core/Src/UnPlat.cpp', [
           ('#if defined(PLATFORM_SDL)\n#include "SDL2/SDL.h"\n',
            '#if defined(PLATFORM_SDL)\n#include "SDL2/SDL.h"\n#ifdef PLATFORM_IOS\nextern "C" void UE1IOSLog( const char* Msg );\n#endif\n'),
           ('\t\t\tif( GLogHook )\n\t\t\t{\n\t\t\t\tGLogHook->WriteBinary( Data, Length, Event );',
            '#ifdef PLATFORM_IOS\n\t\t\t{\n\t\t\t\tchar IosLine[1200];\n\t\t\t\tsnprintf( IosLine, sizeof(IosLine), "%s: %.1000s", *EventName, (const char*)Data );\n\t\t\t\tUE1IOSLog( IosLine );\n\t\t\t}\n#endif\n'
            '\t\t\tif( GLogHook )\n\t\t\t{\n\t\t\t\tGLogHook->WriteBinary( Data, Length, Event );'),
           ('void appError( const char* Msg )\n{\n',
            'void appError( const char* Msg )\n{\n#ifdef PLATFORM_IOS\n\tUE1IOSLog( "appError called:" );\n\tUE1IOSLog( Msg ? Msg : "(null)" );\n\tif( GErrorHist[0] ) UE1IOSLog( GErrorHist );\n#endif\n'),
           ('\tGLogFile = appFopen( GLogFname, "w+t" );\n\tif( GLogFile )\n',
            '\tGLogFile = appFopen( GLogFname, "w+t" );\n#ifdef PLATFORM_IOS\n\t{\n\t\tchar IosMsg[1300]; char IosCwd[1024] = "?";\n\t\tgetcwd( IosCwd, sizeof(IosCwd) );\n\t\tsnprintf( IosMsg, sizeof(IosMsg), "appOpenLog: %s (cwd=%s) -> %s", GLogFname, IosCwd, GLogFile ? "OK" : "FAILED" );\n\t\tUE1IOSLog( IosMsg );\n\t}\n#endif\n\tif( GLogFile )\n'),
          ])

          # ------------------------------------------------------------- SDLLaunch.cpp
          LOGI = lambda m: '#ifdef PLATFORM_IOS\n\tUE1IOSLog( "%s" );\n#endif\n' % m
          edit('engine/Source/Unreal/Src/SDLLaunch.cpp', [
           ('extern "C" void UE1IOSPrepareConfig( const char* SystemDir );\n#endif\n',
            'extern "C" void UE1IOSPrepareConfig( const char* SystemDir );\n#endif\n#ifndef PLATFORM_IOS\n#define UE1IOSLog(x) ((void)0)\n#endif\n'),
           ('\tGIsGuarded=0;\n\tGIsCriticalError=1;\n',
            '\tGIsGuarded=0;\n\tGIsCriticalError=1;\n#ifdef PLATFORM_IOS\n\tUE1IOSLog( "HandleError: engine exception caught, GErrorHist follows" );\n\tUE1IOSLog( GErrorHist );\n#endif\n'),
           ('\tappInit();\n', LOGI('InitEngine: appInit begin') + '\tappInit();\n' + LOGI('InitEngine: appInit done')),
           ('\t// Create the global engine object.\n', LOGI('InitEngine: loading Engine.GameEngine class') + '\t// Create the global engine object.\n'),
           ('\tEngine->Init();\n', LOGI('InitEngine: Engine->Init() begin (viewport / render device / audio)') + '\tEngine->Init();\n' + LOGI('InitEngine: Engine->Init() done')),
           ('\t\tUEngine* Engine = InitEngine();\n\t\tif( !GIsRequestingExit )\n\t\t\tMainLoop( Engine );\n',
            '\t\tUE1IOSLog( "main: InitEngine begin" );\n\t\tUEngine* Engine = InitEngine();\n\t\tUE1IOSLog( "main: InitEngine done, entering MainLoop" );\n\t\tif( !GIsRequestingExit )\n\t\t\tMainLoop( Engine );\n\t\tUE1IOSLog( "main: MainLoop returned" );\n'),
           ('\t\t// Crashed.\n\t\ttry {HandleError();} catch( ... ) {}',
            '\t\t// Crashed.\n\t\tUE1IOSLog( "main: caught exception from InitEngine/MainLoop" );\n\t\ttry {HandleError();} catch( ... ) {}'),
          ])

          # ---------------------------------------------------- host: take over the log
          edit('ios/host/UE1IOSHost.mm', [
           ('extern "C" void UE1IOSLog( const char* Msg )\n', 'static void UE1IOSLog_Unused( const char* Msg )\n'),
           ('#include <pthread.h>\n', '#include <pthread.h>\nextern "C" void UE1IOSLog( const char* Msg ); // ios_diag.mm\n'),
          ])

          # ---------------- clang 19: '[[' starts a C++11 attribute -> 'expected body of lambda expression' on
          # `[[Trim( ... )] floatValue]`. Rewrite as a plain nested message send.
          edit('ios/host/UE1IOSHost.mm', [
           ('float V = [[Trim( [T substringFromIndex:Eq.location + 1] )] floatValue];',
            'float V = [Trim( [T substringFromIndex:Eq.location + 1] ) floatValue];'),
          ])

          # --------------------------------------------------------------- CMakeLists
          edit('CMakeLists.txt', [
           ('  ios/host/UE1IOSHost.mm\n', '  ios/host/UE1IOSHost.mm\n  ios/host/ios_diag.mm\n'),
           ('set_source_files_properties(ios/host/UE1IOSHost.mm PROPERTIES', 'set_source_files_properties(ios/host/UE1IOSHost.mm ios/host/ios_diag.mm PROPERTIES'),
          ])

          # ---------------------------------------------- step-by-step breadcrumbs (debugf => mirrored to unreal_ios.log)
          D = lambda m: '\tdebugf( NAME_Log, "STEP: %s" );\n' % m
          edit('engine/Source/Engine/Src/UnGame.cpp', [
           ('\t// Call base.\n\tUEngine::Init();\n',
            D('UGameEngine::Init begin -> UEngine::Init') + '\t// Call base.\n\tUEngine::Init();\n' + D('UEngine::Init done')),
           ('\tappCleanFileCache();\n', D('appCleanFileCache') + '\tappCleanFileCache();\n'),
           ('\t\tClient->Init( this );\n',
            '\t\tdebugf( NAME_Log, "STEP: Client class constructed, Client->Init (SDL video/display)" );\n\t\tClient->Init( this );\n\t\tdebugf( NAME_Log, "STEP: Client->Init done" );\n'),
           ('\t\tRender->Init( this );\n',
            '\t\tdebugf( NAME_Log, "STEP: Render class constructed, Render->Init" );\n\t\tRender->Init( this );\n\t\tdebugf( NAME_Log, "STEP: Render->Init done" );\n'),
           ('\t\tif( !LoadMap( FURL("Entry"), NULL, Error256 ) )\n',
            '\t\tdebugf( NAME_Log, "STEP: loading Entry level (can take a long time on first run)" );\n\t\tif( !LoadMap( FURL("Entry"), NULL, Error256 ) )\n'),
           ('\t\tExchange( GLevel, GEntry );\n', '\t\tExchange( GLevel, GEntry );\n\t\tdebugf( NAME_Log, "STEP: Entry level loaded" );\n'),
           ('\tUBOOL Success = Browse( FURL(&LastURL,AutoURL,TRAVEL_Partial), Error256 );\n',
            '\tdebugf( NAME_Log, "STEP: Browse initial URL \'%s\' (loads the first map)", AutoURL );\n\tUBOOL Success = Browse( FURL(&LastURL,AutoURL,TRAVEL_Partial), Error256 );\n\tdebugf( NAME_Log, "STEP: Browse returned %d err=\'%s\'", (int)Success, Error256 );\n'),
           ('\t\tUViewport* Viewport = Client->NewViewport( GLevel, NAME_None );\n',
            '\t\tdebugf( NAME_Log, "STEP: creating viewport" );\n\t\tUViewport* Viewport = Client->NewViewport( GLevel, NAME_None );\n\t\tdebugf( NAME_Log, "STEP: viewport created" );\n'),
           ('\t\tViewport->OpenWindow( NULL, 0, Client->ViewportX, Client->ViewportY, INDEX_NONE, INDEX_NONE );\n',
            '\t\tdebugf( NAME_Log, "STEP: Viewport->OpenWindow (SDL window + GL context + render device)" );\n\t\tViewport->OpenWindow( NULL, 0, Client->ViewportX, Client->ViewportY, INDEX_NONE, INDEX_NONE );\n\t\tdebugf( NAME_Log, "STEP: Viewport->OpenWindow done" );\n'),
           ('\tguard(UGameEngine::Tick);\n\tINT LocalTickCycles=0;\n',
            '\tguard(UGameEngine::Tick);\n\t{ static int TickN=0; ++TickN; if( TickN<=5 || TickN%600==0 ) debugf( NAME_Log, "STEP: UGameEngine::Tick #%d dt=%f", TickN, DeltaSeconds ); }\n\tINT LocalTickCycles=0;\n'),
          ])

          edit('engine/Source/NSDLDrv/Src/NSDLViewport.cpp', [
           ('\t\t\t// Creating new viewport.\n\t\t\thWnd = SDL_CreateWindow( "", OpenX, OpenY, NewX, NewY, Flags );\n',
            '\t\t\t// Creating new viewport.\n\t\t\tdebugf( NAME_Log, "STEP: SDL_CreateWindow %dx%d flags=0x%x DoOpenGL=%d", (int)NewX, (int)NewY, (unsigned)Flags, (int)DoOpenGL );\n'
            '\t\t\thWnd = SDL_CreateWindow( "", OpenX, OpenY, NewX, NewY, Flags );\n\t\t\tdebugf( NAME_Log, "STEP: SDL_CreateWindow -> %p (%s)", hWnd, hWnd ? "ok" : SDL_GetError() );\n'),
           ('\t\t\t\tGLCtx = SDL_GL_CreateContext( hWnd );\n',
            '\t\t\t\tdebugf( NAME_Log, "STEP: SDL_GL_CreateContext (requested GLES%d.%d)", 2, 0 );\n\t\t\t\tGLCtx = SDL_GL_CreateContext( hWnd );\n\t\t\t\tdebugf( NAME_Log, "STEP: SDL_GL_CreateContext -> %p (%s)", GLCtx, GLCtx ? "ok" : SDL_GetError() );\n'),
           ('\t\tSDL_ShowWindow( hWnd );\n',
            '\t\tSDL_ShowWindow( hWnd );\n\t\t{\n\t\t\tint Dw = 0, Dh = 0, Ww = 0, Wh = 0;\n\t\t\tSDL_GetWindowSize( hWnd, &Ww, &Wh );\n\t\t\tif( DoOpenGL ) SDL_GL_GetDrawableSize( hWnd, &Dw, &Dh );\n'
            '\t\t\tdebugf( NAME_Log, "STEP: SDL_ShowWindow done; window=%dx%d drawable=%dx%d sdlflags=0x%x", Ww, Wh, Dw, Dh, (unsigned)SDL_GetWindowFlags( hWnd ) );\n\t\t}\n'),
          ])

          edit('engine/Source/NOpenGLESDrv/NOpenGLESDrv.cpp', [
           ('\tdebugf( NAME_Log, "Got OpenGL %s", glGetString( GL_VERSION ) );\n',
            '\tdebugf( NAME_Log, "Got OpenGL %s", glGetString( GL_VERSION ) );\n'
            '\tdebugf( NAME_Log, "GLES: vendor=%s renderer=%s glsl=%s", (const char*)glGetString( GL_VENDOR ), (const char*)glGetString( GL_RENDERER ), (const char*)glGetString( GL_SHADING_LANGUAGE_VERSION ) );\n'
            '\tdebugf( NAME_Log, "GLES: extensions: %.700s", glGetString( GL_EXTENSIONS ) ? (const char*)glGetString( GL_EXTENSIONS ) : "(none)" );\n'
            '\tdebugf( NAME_Log, "GLES: glGetError after context = 0x%x", (unsigned)glGetError() );\n'),
           ('\tguard(UNOpenGLESRenderDevice::Lock);\n',
            '\tguard(UNOpenGLESRenderDevice::Lock);\n\t{ static int LockN=0; ++LockN; if( LockN<=5 || LockN%600==0 ) debugf( NAME_Log, "GLES: Lock frame %d", LockN ); }\n'),
           ('\tguard(UNOpenGLESRenderDevice::Unlock);\n',
            '\tguard(UNOpenGLESRenderDevice::Unlock);\n\t{ static int UnlockN=0; ++UnlockN; if( UnlockN<=5 || UnlockN%600==0 ) debugf( NAME_Log, "GLES: Unlock frame %d blit=%d glError=0x%x", UnlockN, (int)Blit, (unsigned)glGetError() ); }\n'),
          ])

          edit('engine/Source/Unreal/Src/SDLLaunch.cpp', [
           ('\t\tEngine->Tick( NewTime - OldTime );\n',
            '\t\t{ static int LoopN=0; ++LoopN; if( LoopN<=3 ) debugf( NAME_Log, "STEP: MainLoop iteration %d", LoopN ); }\n\t\tEngine->Tick( NewTime - OldTime );\n'),
          ])


          # ---------------- SDL joystick: SDL_JOYSTICK must stay ON (UE1's SDL_Init requests SDL_INIT_JOYSTICK and fails with
          # "SDL not built with joystick support" otherwise). The MFi driver can't build with the 9.3 SDK -> use SDL's dummy driver.
          edit('third_party/SDL2/CMakeLists.txt', [
           # SDL typo: framework is spelled 'Coremotion' (fine on case-insensitive macOS, not for our Linux-hosted SDK lookup)
           ('FRAMEWORK,Coremotion>', 'FRAMEWORK,CoreMotion>'),
           ('      file(GLOB JOYSTICK_SOURCES ${SDL2_SOURCE_DIR}/src/joystick/steam/*.c)\n      set(SDL_JOYSTICK_MFI 1)\n',
            '      file(GLOB JOYSTICK_SOURCES ${SDL2_SOURCE_DIR}/src/joystick/steam/*.c ${SDL2_SOURCE_DIR}/src/joystick/dummy/*.c)\n      set(SDL_JOYSTICK_DUMMY 1)\n      set(MFI_JOYSTICK_SOURCES "")\n'),
          ])

          # ---------------- SDL_joystick.c registers &SDL_IOS_JoystickDriver on a PLATFORM-macro guard (__IPHONEOS__), not on
          # SDL_JOYSTICK_MFI, so it still references the MFi driver we dropped above -> undefined symbol at link time.
          # SDL_uikitview.m also references SDL_AppleTVRemoteOpenedAsJoystick (normally defined in SDL_mfijoystick.m).
          edit('third_party/SDL2/src/joystick/SDL_joystick.c', [
           ('#if (defined(__MACOSX__) || defined(__IPHONEOS__) || defined(__TVOS__)) && !defined(SDL_JOYSTICK_DISABLED)\n    &SDL_IOS_JoystickDriver,\n#endif\n', ''),
          ])
          with open('third_party/SDL2/src/joystick/SDL_joystick.c', 'a', encoding='utf-8', newline='') as f:
              f.write('\n/* iOS build without the MFi driver: satisfy SDL_uikitview.m */\nint SDL_AppleTVRemoteOpenedAsJoystick = 0;\n')

          # ---------------- Engine.Engine.Render must be the Render package's renderer (Render.Render), NOT the GLES *device*.
          # The host forced Render=NOpenGLESDrv.NOpenGLESRenderDevice -> "not a child class of Engine.RenderBase" at startup.
          # (Overwrite=YES, so an already-written bad Unreal.ini on the device is repaired on next launch.)
          edit('ios/host/UE1IOSHost.mm', [
           ('IniSet( L, @"Engine.Engine", @"Render",               @"NOpenGLESDrv.NOpenGLESRenderDevice", YES );',
            'IniSet( L, @"Engine.Engine", @"Render",               @"Render.Render",                      YES );'),
          ])

          # ---------------- GLES driver on iOS (device log: glError 0x502 on EVERY frame, black/garbled output):
          #  1) Apple GLES2 raises GL_INVALID_OPERATION for glBindFramebuffer(GL_FRAMEBUFFER, 0): the on-screen framebuffer is
          #     SDL's own FBO. Lock() -> BindAndroidSceneFBO() binds 0 every frame, so nothing reaches the screen. Capture the
          #     FBO that SDL left bound after context creation (Init) and bind that instead of 0.
          #  2) GL_APPLE_texture_format_BGRA8888 requires internalformat GL_RGBA with format GL_BGRA_EXT (EXT_ variant allows both).
          path = 'engine/Source/NOpenGLESDrv/NOpenGLESDrv.cpp'
          edit(path, [
           ('IMPLEMENT_CLASS(UNOpenGLESRenderDevice);\n',
            'IMPLEMENT_CLASS(UNOpenGLESRenderDevice);\n#ifdef PLATFORM_IOS\nstatic GLuint UE1GLESDefaultFBO = 0; // SDL/UIKit on-screen framebuffer (FBO 0 is invalid on Apple GLES2)\n#else\n#define UE1GLESDefaultFBO 0\n#endif\n'),
           ('\tNoVolumetricBlend = true;\n\tSupportsFogMaps = true;\n',
            '#ifdef PLATFORM_IOS\n\t{\n\t\tGLint CurFBO = 0;\n\t\tglGetIntegerv( GL_FRAMEBUFFER_BINDING, &CurFBO );\n\t\tUE1GLESDefaultFBO = (GLuint)CurFBO;\n\t\tdebugf( NAME_Log, "GLES: iOS default framebuffer = %u", (unsigned)UE1GLESDefaultFBO );\n\t}\n#endif\n\tNoVolumetricBlend = true;\n\tSupportsFogMaps = true;\n'),
           ('\t\t\tglTexImage2D( GL_TEXTURE_2D, UploadMipIndex, UploadFormat, Mip->USize, Mip->VSize, 0, UploadFormat, GL_UNSIGNED_BYTE, (void*)UploadBuf );\n',
            '\t\t\tglTexImage2D( GL_TEXTURE_2D, UploadMipIndex, ( UploadFormat == GL_BGRA_EXT && !GLAD_GL_EXT_texture_format_BGRA8888 ) ? (GLint)GL_RGBA : (GLint)UploadFormat, Mip->USize, Mip->VSize, 0, UploadFormat, GL_UNSIGNED_BYTE, (void*)UploadBuf );\n'),
          ])
          src = open(path, encoding='utf-8', newline='').read()
          needle = 'glBindFramebuffer( GL_FRAMEBUFFER, 0 )'
          if src.count(needle) != 4:
              sys.exit("expected 4 x %s in NOpenGLESDrv.cpp, found %d" % (needle, src.count(needle)))
          open(path, 'w', encoding='utf-8', newline='').write(src.replace(needle, 'glBindFramebuffer( GL_FRAMEBUFFER, UE1GLESDefaultFBO )'))

          print("diag patches applied")
          EOF_PY
          python3 -I ios/scripts/apply_diag.py
      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build curl zip unzip xz-utils bzip2 git
      - name: Theos + toolchain + SDK
        run: |
          set -euo pipefail
          export THEOS="$GITHUB_WORKSPACE/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain/linux/iphone" "$THEOS/sdks"
          curl -fsSL "https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz" -o /tmp/tc.tar.xz
          tar -xf /tmp/tc.tar.xz -C "$THEOS/toolchain"
          curl -fsSL -o /tmp/sdk.tbz2 "https://raw.githubusercontent.com/Sn0wCooder/theos-sdks/master/iPhoneOS9.3.sdk.tbz2"
          tar -xjf /tmp/sdk.tbz2 -C "$THEOS/sdks"
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          for fw in "$SDK"/System/Library/Frameworks/*.framework; do
            [ -f "$fw/module.map" ] && { mkdir -p "$fw/Modules"; mv "$fw/module.map" "$fw/Modules/module.modulemap"; }
          done
          find "$SDK/usr/include" -name module.map | while read -r m; do mv "$m" "$(dirname "$m")/module.modulemap"; done
          # toolchain's ar/ranlib wrappers call a missing aarch64-apple-darwin14-ranlib -> make it exist
          TB="$THEOS/toolchain/linux/iphone/bin"
          for t in ranlib; do
            [ -e "$TB/aarch64-apple-darwin14-$t" ] || ln -sf "$TB/llvm-$t" "$TB/aarch64-apple-darwin14-$t" 2>/dev/null || true
          done
          ls "$TB" | grep -E 'llvm-(ar|ranlib)$|ranlib' || true
          echo "== libc++ discovery"
          find "$SDK/usr/include" -maxdepth 2 -iname '*c++*' 2>/dev/null | head
          find "$THEOS/toolchain" -name '__config_site' 2>/dev/null | head
          CS="$TB/../include/c++/v1/__config_site"
          if [ -d "$SDK/usr/include/c++/v1" ]; then echo "SDK libc++ headers: ok"
          elif [ ! -f "$CS" ]; then
            FOUND="$(find "$THEOS/toolchain" -name '__config_site' 2>/dev/null | head -n1)"
            if [ -n "$FOUND" ]; then cp "$FOUND" "$CS"; else
              echo "no __config_site anywhere; writing one (libc++ 19, Apple, pthread)"
              cat > "$CS" <<'EOF_CS'
          #ifndef _LIBCPP_CONFIG_SITE
          #define _LIBCPP_CONFIG_SITE
          #define _LIBCPP_ABI_VERSION 1
          #define _LIBCPP_ABI_NAMESPACE __1
          #define _LIBCPP_HAS_THREAD_API_PTHREAD 1
          #define _LIBCPP_HARDENING_MODE_DEFAULT _LIBCPP_HARDENING_MODE_NONE
          #define _LIBCPP_PSTL_BACKEND_SERIAL 1
          #endif
          EOF_CS
            fi
          fi
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
      - name: Toolchain sanity (shows the real compiler error)
        run: |
          B="$THEOS/toolchain/linux/iphone/bin"; SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          ls "$B" | head -50; ls "$SDK" | head
          printf '#include <fcntl.h>\n#include <pthread.h>\n#include <math.h>\nint main(void){pthread_attr_t t;pthread_attr_init(&t);return (int)tan(1.0)+O_CLOEXEC;}\n' > /tmp/t.c
          echo "== compile (cmake-style flags)"; "$B/clang" --target=armv7-apple-ios7.0 -arch armv7 -miphoneos-version-min=7.0 -isysroot "$SDK" -fno-modules -c /tmp/t.c -o /tmp/t.o -v || true
          echo "== archive"; "$B/llvm-ar" qc /tmp/t.a /tmp/t.o && echo archive-ok || true
          ls -la /tmp/t.o /tmp/t.a || true
      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=ios/cmake/ios-armv7-toolchain.cmake 2>&1 | tee build-configure.log || {
            echo "::group::CMakeError.log"; tail -n 120 build/CMakeFiles/CMakeError.log || true; echo "::endgroup::"
            cp build/CMakeFiles/CMakeError.log build-cmakeerror.log 2>/dev/null || true
            exit 1; }
      - name: Build
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" 2>&1 | tee build-make.log
      - name: Verify Mach-O
        run: |
          file build/UnrealiOS || true
          "$THEOS"/toolchain/linux/iphone/bin/*otool* -hv build/UnrealiOS | head || true
      - name: Package
        run: ios/scripts/package_ios.sh build build/out
      - uses: actions/upload-artifact@v4
        with: { name: Unreal98-armv7-iOS, path: build/out/UnrealiOS.ipa, if-no-files-found: error }
      - name: Package .deb (jailbreak, installs to /Applications)
        run: |
          set -euo pipefail
          APP=build/out/Payload/UnrealiOS.app
          D=build/out/deb; rm -rf "$D"; mkdir -p "$D/DEBIAN" "$D/Applications"
          cp -a "$APP" "$D/Applications/UnrealiOS.app"
          chmod 755 "$D/Applications/UnrealiOS.app/UnrealiOS"
          cat > "$D/DEBIAN/control" <<'EOF_CTL'
          Package: com.example.unreal98.armv7
          Name: Unreal 98
          Version: 0.1.0
          Architecture: iphoneos-arm
          Description: Unreal Engine 1 (Unreal 98) for iOS armv7
          Maintainer: makaherpasswordlostmedia
          Author: makaherpasswordlostmedia
          Section: Games
          Depends: firmware (>= 7.0)
          EOF_CTL
          printf '#!/bin/sh\n(uicache -p /Applications/UnrealiOS.app || uicache) >/dev/null 2>&1 || true\nexit 0\n' > "$D/DEBIAN/postinst"
          printf '#!/bin/sh\n(uicache) >/dev/null 2>&1 || true\nexit 0\n' > "$D/DEBIAN/postrm"
          chmod 755 "$D/DEBIAN/postinst" "$D/DEBIAN/postrm"
          # gzip: the dpkg on old iOS can't read xz/zstd
          dpkg-deb --root-owner-group -Zgzip -b "$D" build/out/UnrealiOS_0.1.0_iphoneos-arm.deb
          dpkg-deb -I build/out/UnrealiOS_0.1.0_iphoneos-arm.deb
          dpkg-deb -c build/out/UnrealiOS_0.1.0_iphoneos-arm.deb | head -20
      - uses: actions/upload-artifact@v4
        with: { name: Unreal98-armv7-iOS-deb, path: build/out/UnrealiOS_0.1.0_iphoneos-arm.deb, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-logs, path: "build-*.log", if-no-files-found: ignore }
